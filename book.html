<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pablo Moreno | Book</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav class="container nav">
    <div class="branding">
      <h1 class="logo">Pablo Moreno</h1>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="book.html">Book</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="statement.html">Statement</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="container">
  <section class="page-header">
    <h2>Book Los Meseros</h2>
    <p>Fill out the form below to book our services for your event.</p>
  </section>

  <section class="contact-form-section">
    <form class="contact-form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="event-type">Event Type</label>
      <select id="event-type" name="event-type">
        <option value="wedding">Wedding</option>
        <option value="corporate">Corporate</option>
        <option value="party">Private Party</option>
        <option value="other">Other</option>
      </select>

      <label for="date">Event Date</label>
      <input type="date" id="date" name="date" required>

      <label for="message">Additional Details</label>
      <textarea id="message" name="message" rows="5"></textarea>

      <button type="submit" class="button">Submit Booking Request</button>
    </form>
  </section>
</main>

<footer>
  <div class="container footer-content">
    <p>&copy; <span id="year"></span> Pablo Moreno</p>
    <button id="theme-toggle" class="button toggle-button" type="button" aria-label="Toggle dark and light mode">Switch to Dark Mode</button>
    <p>Last Edited: <span id="last-edited"></span></p>
  </div>
</footer>

<script src="script.js"></script>

</body>
</html>
